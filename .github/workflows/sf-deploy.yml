          MEMBERS=$(cat /tmp/haviq_members.txt 2>/dev/null || echo "")
          echo "[haviq] retrieved: $MEMBERS"
          if [ -s /tmp/haviq_drop.txt ]; then
            while IFS= read -r P; do
              [ -z "$P" ] && continue
              if [ -e "$P" ]; then rm -f "$P";
              else find force-app -type f -name "${P}.*" -delete 2>/dev/null || true; fi
            done < /tmp/haviq_drop.txt
          fi
          printf "%s" "$MEMBERS" > /tmp/haviq_members.txt
          if [ -z "$MEMBERS" ]; then
            echo "[haviq] The retrieve returned no components. Nothing will be"
            echo "[haviq] committed — a commit here would delete the request file"
            echo "[haviq] and report success having retrieved nothing."
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/haviq_retrieve.json'));ms=(d.get('result') or {}).get('messages') or [];ms=[ms] if isinstance(ms,dict) else ms;[print('[haviq] WARNING from retrieve: '+str(m.get('problem'))) for m in ms]" 2>/dev/null || true
          git config user.email "ci@haviq.local"
          git config user.name "HAV-IQ CI"
          cp -f manifest/haviq-retrieve-keep.txt /tmp/haviq_keep.txt 2>/dev/null || true
          rm -f manifest/haviq-retrieve.xml manifest/haviq-retrieve-keep.txt
          git rm -q --cached --ignore-unmatch manifest/haviq-retrieve.xml manifest/haviq-retrieve-keep.txt >/dev/null 2>&1 || true
          if [ -s /tmp/haviq_keep.txt ]; then
            while IFS= read -r KD; do
              [ -n "$KD" ] && git add -- "$KD" 2>/dev/null || true
            done < /tmp/haviq_keep.txt
          else
            echo "[haviq] no keep-list in the request — refusing to guess"
            echo "[haviq] which retrieved files are safe to commit."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "[haviq] nothing to commit — the retrieve produced no files."
          else
            git commit -m "chore: HAV-IQ CI retrieve [skip ci]"
            n=0
            until git push origin HEAD:production 2>/tmp/haviq_push.err; do
              n=$((n+1))
              sed "s/^/[haviq]   /" /tmp/haviq_push.err || true
              if grep -qiE "restrict|protected|permission|denied|403" /tmp/haviq_push.err; then
                echo "[haviq] GitHub refused the push to production. Branch protection on it"
                echo "[haviq] blocks the workflow's GITHUB_TOKEN. Allow GitHub Actions to push to"
                echo "[haviq] production (or exempt it from the rule), then retry the deployment."
                exit 1
              fi
              [ $n -ge 3 ] && echo "[haviq] push failed after $n attempts" && exit 1
              echo "[haviq] push rejected — the branch moved. Rebasing (attempt $n)."
              git pull --rebase origin production || { \
                echo "[haviq] REBASE CONFLICT. Someone edited the same component"; \
                echo "[haviq] while this retrieve was running. Resolve it in HAV-IQ"; \
                echo "[haviq] and retry — this job will not resolve it for you."; \
                exit 1; }
            done
          fi
      - name: Notify HAV-IQ
        if: always()
        env:
          HQ_STATUS: ${{ job.status == 'success' && 'success' || 'failed' }}
          HQ_BRANCH: ${{ github.ref_name }}
          HQ_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HAVIQ_PRIVATE_KEY: ${{ secrets.HAVIQ_PRIVATE_KEY }}
          HAVIQ_CLIENT_ID: ${{ vars.HAVIQ_CLIENT_ID }}
          HAVIQ_USERNAME: ${{ vars.HAVIQ_USERNAME }}
          HAVIQ_URL: ${{ vars.HAVIQ_URL }}
          SF_WEBHOOK_SECRET: ${{ secrets.SF_WEBHOOK_SECRET }}
        run: |
          grep -q "\[haviq-retrieve\]" /tmp/haviq_msg.txt 2>/dev/null || exit 0
          echo "$HAVIQ_PRIVATE_KEY" > /tmp/haviq.key
          HAVIQ_LOGIN_OUT=$(sf org login jwt --client-id "$HAVIQ_CLIENT_ID" --jwt-key-file /tmp/haviq.key --username "$HAVIQ_USERNAME" --instance-url "$HAVIQ_URL" --alias haviq-hub 2>&1) || true
          SF_TOKEN=$(sf org auth show-access-token --target-org haviq-hub --json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result']['accessToken'])" 2>/dev/null || echo "")
          case "$SF_TOKEN" in *[[:space:]]*) SF_TOKEN="" ;; esac
          if [ -z "$SF_TOKEN" ]; then
            echo "[haviq] callback SKIPPED — no access token. HAV-IQ will read this"
            echo "[haviq] run's result itself within a few minutes. The JWT login said:"
            echo "$HAVIQ_LOGIN_OUT" | head -6 | sed "s/^/[haviq]   /"
          else
            DEPID=$(sed -n "s/.*for deployment \([a-zA-Z0-9]*\).*/\1/p" /tmp/haviq_msg.txt | head -1)
            MEMBERS=$(cat /tmp/haviq_members.txt 2>/dev/null || echo "")
            BODY="{\"phase\":\"retrieve\",\"deploymentId\":\"$DEPID\",\"branch\":\"$HQ_BRANCH\",\"status\":\"$HQ_STATUS\",\"retrievedMembers\":\"$MEMBERS\",\"ciRunUrl\":\"$HQ_RUN_URL\"}"
            HAVIQ_HTTP=$(curl -s -o /tmp/haviq_cb.out -w "%{http_code}" -X POST "$HAVIQ_URL/services/apexrest/haviq/pipeline/webhook" -H "Authorization: Bearer $SF_TOKEN" -H "Content-Type: application/json" -H "x-sf-devops-secret: $SF_WEBHOOK_SECRET" -d "$BODY" || echo "000")
            echo "[haviq] retrieve callback HTTP $HAVIQ_HTTP"
            [ "$HAVIQ_HTTP" = "200" ] || head -c 500 /tmp/haviq_cb.out 2>/dev/null | sed "s/^/[haviq]   /" || true
            rm -f /tmp/haviq_cb.out
          fi
          rm -f /tmp/haviq.key server.key /tmp/haviq_members.txt

  # ── Feature PR → target stage (RM-Z8)
  deploy_feature:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.head_ref, 'feature/')
      && !contains(github.head_ref, '-resolve-')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @salesforce/cli
      - name: Authenticate to the PR target org
        env:
          HAVIQ_SECRETS: ${{ toJSON(secrets) }}
          HAVIQ_VARS: ${{ toJSON(vars) }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          TGT=$(echo "$BASE_REF" | tr "[:lower:]" "[:upper:]" | sed "s/[^A-Z0-9]/_/g")
          K=$(echo "$HAVIQ_SECRETS" | jq -r --arg k "SF_JWT_KEY_$TGT"   '.[$k] // empty')
          C=$(echo "$HAVIQ_VARS"    | jq -r --arg k "SF_CLIENT_ID_$TGT" '.[$k] // empty')
          U=$(echo "$HAVIQ_VARS"    | jq -r --arg k "SF_USERNAME_$TGT"  '.[$k] // empty')
          O=$(echo "$HAVIQ_VARS"    | jq -r --arg k "SF_ORG_URL_$TGT"   '.[$k] // empty')
          if [ -z "$K" ]; then
            echo "Missing GitHub Actions SECRET SF_JWT_KEY_$TGT (target branch $BASE_REF)."
            echo "HAV-IQ cannot push secrets — add it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          if [ -z "$C" ] || [ -z "$U" ] || [ -z "$O" ]; then
            echo "No SF_*_$TGT variables for target branch $BASE_REF — is it a configured stage?"; exit 1;
          fi
          echo "$K" > server.key
          sf org login jwt --client-id "$C" --jwt-key-file server.key --username "$U" --instance-url "$O" --alias target
      - name: Resolve HAV-IQ manifest
        env:
          HAVIQ_VARS: ${{ toJSON(vars) }}
        run: |
          TOK=$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")
          if [ -z "$TOK" ]; then
            if [ -s manifest/package.xml ]; then
              echo "No [haviq-dep:] token; falling back to the manifest on the branch."
              exit 0
            fi
            echo "ERROR: no manifest on the branch and no [haviq-dep:] token in the commit message"; exit 1
          fi
          echo "SF_DEPLOYMENT_ID=$TOK" >> "$GITHUB_ENV"
          # GitHub stores Actions variable names UPPERCASED, and deploy ids are
          # mixed case — look up the uppercased name or the lookup silently misses.
          TOK=$(echo "$TOK" | tr "[:lower:]" "[:upper:]")
          mkdir -p manifest
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_PKG_$TOK" '.[$k] // empty' > manifest/package.xml
          if [ ! -s manifest/package.xml ]; then echo "ERROR: variable HAVIQ_PKG_$TOK not set"; exit 1; fi
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_DESTRUCTIVE_$TOK" '.[$k] // empty' > manifest/destructiveChanges.xml
          echo "[OI-292] manifest (dep $TOK):"; cat manifest/package.xml
      - name: Deploy to the PR target org
        run: |
          MSG=$(git log -20 --pretty=%B)
          LEVEL=$(echo "$MSG" | grep -oE "\[test-level:[A-Za-z]+\]" | head -1 | sed -E "s/\[test-level:([A-Za-z]+)\]/\1/" || true)
          if [ -z "$LEVEL" ]; then echo "$MSG" | grep -q "\[run-tests\]" && LEVEL=RunLocalTests || LEVEL=NoTestRun; fi
          echo "$MSG" | grep -q "\[validate-only\]" && DCMD=validate || DCMD=start
          if [ "$LEVEL" = "RunSpecifiedTests" ]; then
            TESTS=$(echo "$MSG" | grep -oE "\[tests:[^]]+\]" | head -1 | sed -E "s/\[tests:(.*)\]/\1/" || true)
            TF=""; for t in $(echo "$TESTS" | tr "," " "); do TF="$TF --tests $t"; done
            sf project deploy $DCMD --manifest manifest/package.xml --target-org target --test-level RunSpecifiedTests $TF --wait 30
          else
            sf project deploy $DCMD --manifest manifest/package.xml --target-org target --test-level "$LEVEL" --wait 30
          fi
      - name: Apply destructive changes
        run: |
          if [ -s manifest/destructiveChanges.xml ] && grep -q "<members>" manifest/destructiveChanges.xml; then
            echo "Applying destructive changes..."
            set +e
            DOUT=$(sf project deploy start --manifest manifest/package.xml --post-destructive-changes manifest/destructiveChanges.xml --target-org target --test-level NoTestRun --wait 30 2>&1)
            DRC=$?
            set -e
            echo "$DOUT"
            if [ $DRC -ne 0 ]; then
              ABSENT=$(echo "$DOUT" | grep -oE "No [A-Za-z]+ named:? [^ ]+ found" | sort -u)
              OTHER=$(echo "$DOUT" | grep -iE "error|Problem" | grep -vcE "No [A-Za-z]+ named:? [^ ]+ found")
              if [ -n "$ABSENT" ] && [ "$OTHER" -eq 0 ]; then
                echo "[OI-317] Deletions skipped - already absent from the target org:"
                echo "$ABSENT"
                echo "[OI-317] The intended end state is already true. Continuing."
                echo "$ABSENT" > /tmp/haviq-already-absent.txt
              else
                echo "[OI-317] Destructive deploy failed beyond already-absent components."
                exit $DRC
              fi
            fi
          else
            echo "No destructive changes."
          fi
      - name: Notify HAV-IQ
        if: always()
        env:
          SF_JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SF_WEBHOOK_SECRET: ${{ secrets.SF_WEBHOOK_SECRET }}
          SF_BRANCH: ${{ github.head_ref || github.ref_name }}
          SF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          STATUS=$([ "$SF_JOB_STATUS" = "success" ] && echo "passed" || echo "failed")
          ABSENT_JSON=""
          if [ -f /tmp/haviq-already-absent.txt ]; then
            ABSENT_JSON=$(python3 -c "import json;t=open('/tmp/haviq-already-absent.txt').read().strip();print(',\"alreadyAbsent\":'+json.dumps(t) if t else '')" 2>/dev/null || echo "")
          fi
          # OI-209: capture deploy failure reason from job log
          FAILURE_REASON_JSON=""
          if [ "$STATUS" = "failed" ]; then
            TRACE=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/jobs/${{ github.job }}/logs" 2>/dev/null || echo "")
            MATCHED=$(echo "$TRACE" | grep -E "Problem|No such column|Variable does not exist|Component Failures|FAILED|✘" | head -40)
            # Fallback: a fixed keyword list always misses the next novel error — keep the trace tail so the reason is never blank.
            if [ -z "$MATCHED" ]; then MATCHED=$(echo "$TRACE" | grep -v "^[[:space:]]*$" | tail -40); fi
            FAILURE_REASON_JSON=$(echo "$MATCHED" | sed "s/\x1b\[[0-9;]*m//g" | head -c 30000 | python3 -c "import sys,json;t=sys.stdin.read().strip();print(json.dumps(t) if t else \"\")" 2>/dev/null || echo "")
          fi
          echo "${{ secrets.HAVIQ_PRIVATE_KEY }}" > /tmp/haviq.key
          sf org login jwt --client-id "${{ vars.HAVIQ_CLIENT_ID }}" --jwt-key-file /tmp/haviq.key --username "${{ vars.HAVIQ_USERNAME }}" --instance-url "${{ vars.HAVIQ_URL }}" --alias haviq-hub
          SF_TOKEN=$(sf org auth show-access-token --target-org haviq-hub --json | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result']['accessToken'])" 2>/dev/null || echo "")
          if [ -n "$SF_TOKEN" ]; then
            if [ -n "$FAILURE_REASON_JSON" ]; then
              BODY="{\"branch\":\"$SF_BRANCH\",\"commitSha\":\"$SF_COMMIT_SHA\",\"deploymentId\":\"$SF_DEPLOYMENT_ID\",\"status\":\"$STATUS\",\"failureReason\":$FAILURE_REASON_JSON,\"ciRunUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"$ABSENT_JSON}"
            else
              BODY="{\"branch\":\"$SF_BRANCH\",\"commitSha\":\"$SF_COMMIT_SHA\",\"deploymentId\":\"$SF_DEPLOYMENT_ID\",\"status\":\"$STATUS\",\"ciRunUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"$ABSENT_JSON}"
            fi
            HAVIQ_HTTP=$(curl -s -o /tmp/haviq_cb.out -w "%{http_code}" -X POST "${{ vars.HAVIQ_URL }}/services/apexrest/haviq/pipeline/webhook" -H "Authorization: Bearer $SF_TOKEN" -H "Content-Type: application/json" -H "x-sf-devops-secret: $SF_WEBHOOK_SECRET" -d "$BODY" || echo "000")
            echo "HAV-IQ callback HTTP $HAVIQ_HTTP"; cat /tmp/haviq_cb.out 2>/dev/null || true
            if [ "$HAVIQ_HTTP" = "401" ]; then echo "Callback rejected: check the SF_WEBHOOK_SECRET repository secret matches the pipeline webhook secret."; fi
          fi
          rm -f /tmp/haviq.key
