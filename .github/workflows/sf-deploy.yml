  # ── Rollback: production
  rollback_production:
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'rollback/production-')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @salesforce/cli
      - run: |
          echo "${{ secrets.SF_JWT_KEY_PRODUCTION }}" > server.key
          sf org login jwt --client-id ${{ vars.SF_CLIENT_ID_PRODUCTION }} --jwt-key-file server.key --username ${{ vars.SF_USERNAME_PRODUCTION }} --instance-url ${{ vars.SF_ORG_URL_PRODUCTION }} --alias target
      - name: Resolve HAV-IQ manifest
        env:
          HAVIQ_VARS: ${{ toJSON(vars) }}
        run: |
          TOK=$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")
          if [ -z "$TOK" ]; then
            if [ -s manifest/package.xml ]; then
              echo "No [haviq-dep:] token; falling back to the manifest on the branch."
              exit 0
            fi
            echo "ERROR: no manifest on the branch and no [haviq-dep:] token in the commit message"; exit 1
          fi
          echo "SF_DEPLOYMENT_ID=$TOK" >> "$GITHUB_ENV"
          # GitHub stores Actions variable names UPPERCASED, and deploy ids are
          # mixed case — look up the uppercased name or the lookup silently misses.
          TOK=$(echo "$TOK" | tr "[:lower:]" "[:upper:]")
          mkdir -p manifest
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_PKG_$TOK" '.[$k] // empty' > manifest/package.xml
          if [ ! -s manifest/package.xml ]; then echo "ERROR: variable HAVIQ_PKG_$TOK not set"; exit 1; fi
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_DESTRUCTIVE_$TOK" '.[$k] // empty' > manifest/destructiveChanges.xml
          echo "[OI-292] manifest (dep $TOK):"; cat manifest/package.xml
      - run: |
          # OI-278 (v1.50): single sf project deploy start per rollback job
          HAS_DEL=$( [ -f manifest/destructiveChanges.xml ] && grep -q "<members>" manifest/destructiveChanges.xml && echo 1 || echo 0 )
          HAS_PKG=$( [ -f manifest/package.xml ] && grep -q "<members>" manifest/package.xml && echo 1 || echo 0 )
          if [ "$HAS_DEL" = "1" ]; then
            echo "Rollback: reverting (destructive + restore in one operation)..."
            set +e
            DOUT=$(sf project deploy start --manifest manifest/package.xml --pre-destructive-changes manifest/destructiveChanges.xml --target-org target --test-level NoTestRun --wait 30 2>&1)
            DRC=$?
            set -e
            echo "$DOUT"
            if [ $DRC -ne 0 ]; then
              ABSENT=$(echo "$DOUT" | grep -oE "No [A-Za-z]+ named:? [^ ]+ found" | sort -u)
              OTHER=$(echo "$DOUT" | grep -iE "error|Problem" | grep -vcE "No [A-Za-z]+ named:? [^ ]+ found")
              if [ -n "$ABSENT" ] && [ "$OTHER" -eq 0 ]; then
                echo "[OI-317] Deletions skipped - already absent from the target org:"
                echo "$ABSENT"
                echo "[OI-317] The intended end state is already true. Continuing."
                echo "$ABSENT" > /tmp/haviq-already-absent.txt
              else
                echo "[OI-317] Destructive deploy failed beyond already-absent components."
                exit $DRC
              fi
            fi
          elif [ "$HAS_PKG" = "1" ]; then
            echo "Rollback: restoring components..."
            sf project deploy start --manifest manifest/package.xml --target-org target --test-level NoTestRun --wait 30
          else
            echo "Rollback: nothing to deploy (empty manifests)."
            exit 1
          fi
      - name: Notify HAV-IQ
        if: always()
        env:
          SF_JOB_STATUS: ${{ job.status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SF_WEBHOOK_SECRET: ${{ secrets.SF_WEBHOOK_SECRET }}
          SF_BRANCH: ${{ github.head_ref || github.ref_name }}
          SF_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          STATUS=$([ "$SF_JOB_STATUS" = "success" ] && echo "passed" || echo "failed")
          ABSENT_JSON=""
          if [ -f /tmp/haviq-already-absent.txt ]; then
            ABSENT_JSON=$(python3 -c "import json;t=open('/tmp/haviq-already-absent.txt').read().strip();print(',\"alreadyAbsent\":'+json.dumps(t) if t else '')" 2>/dev/null || echo "")
          fi
          # OI-209: capture deploy failure reason from job log
          FAILURE_REASON_JSON=""
          if [ "$STATUS" = "failed" ]; then
            TRACE=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/jobs/${{ github.job }}/logs" 2>/dev/null || echo "")
            MATCHED=$(echo "$TRACE" | grep -E "Problem|No such column|Variable does not exist|Component Failures|FAILED|✘" | head -40)
            # Fallback: a fixed keyword list always misses the next novel error — keep the trace tail so the reason is never blank.
            if [ -z "$MATCHED" ]; then MATCHED=$(echo "$TRACE" | grep -v "^[[:space:]]*$" | tail -40); fi
            FAILURE_REASON_JSON=$(echo "$MATCHED" | sed "s/\x1b\[[0-9;]*m//g" | head -c 30000 | python3 -c "import sys,json;t=sys.stdin.read().strip();print(json.dumps(t) if t else \"\")" 2>/dev/null || echo "")
          fi
          echo "${{ secrets.HAVIQ_PRIVATE_KEY }}" > /tmp/haviq.key
          sf org login jwt --client-id "${{ vars.HAVIQ_CLIENT_ID }}" --jwt-key-file /tmp/haviq.key --username "${{ vars.HAVIQ_USERNAME }}" --instance-url "${{ vars.HAVIQ_URL }}" --alias haviq-hub
          SF_TOKEN=$(sf org auth show-access-token --target-org haviq-hub --json | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result']['accessToken'])" 2>/dev/null || echo "")
          if [ -n "$SF_TOKEN" ]; then
            if [ -n "$FAILURE_REASON_JSON" ]; then
              BODY="{\"branch\":\"$SF_BRANCH\",\"commitSha\":\"$SF_COMMIT_SHA\",\"deploymentId\":\"$SF_DEPLOYMENT_ID\",\"status\":\"$STATUS\",\"failureReason\":$FAILURE_REASON_JSON,\"ciRunUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"$ABSENT_JSON}"
            else
              BODY="{\"branch\":\"$SF_BRANCH\",\"commitSha\":\"$SF_COMMIT_SHA\",\"deploymentId\":\"$SF_DEPLOYMENT_ID\",\"status\":\"$STATUS\",\"ciRunUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"$ABSENT_JSON}"
            fi
            HAVIQ_HTTP=$(curl -s -o /tmp/haviq_cb.out -w "%{http_code}" -X POST "${{ vars.HAVIQ_URL }}/services/apexrest/haviq/pipeline/webhook" -H "Authorization: Bearer $SF_TOKEN" -H "Content-Type: application/json" -H "x-sf-devops-secret: $SF_WEBHOOK_SECRET" -d "$BODY" || echo "000")
            echo "HAV-IQ callback HTTP $HAVIQ_HTTP"; cat /tmp/haviq_cb.out 2>/dev/null || true
            if [ "$HAVIQ_HTTP" = "401" ]; then echo "Callback rejected: check the SF_WEBHOOK_SECRET repository secret matches the pipeline webhook secret."; fi
          fi
          rm -f /tmp/haviq.key

