                echo "[haviq] WARNING: .forceignore appears to exclude $T."
                echo "[haviq] The CLI will write nothing for it and still exit 0."
                echo "[haviq] Remove the matching line from .forceignore:"
                grep -n -i "/${LT}s\?/" .forceignore | sed "s/^/[haviq]   /"
              fi
            done
          fi
          sf org list metadata-types --target-org haviq-source --json > /tmp/haviq_mdtypes.json 2>&1 || true
          python3 -c "import json,re;raw=open('/tmp/haviq_mdtypes.json').read();raw=raw[raw.index(chr(123)):] if chr(123) in raw else '{}';objs=(json.loads(raw).get('result') or {}).get('metadataObjects') or [];sup=set();[sup.add(o['xmlName']) for o in objs if o.get('xmlName')];[sup.add(c) for o in objs for c in (o.get('childXmlNames') or [])];src=open('manifest/haviq-retrieve.xml').read();blocks=re.findall(r'<types>.*?</types>', src, re.S);nm=lambda b:(re.search(r'<name>(.*?)</name>', b) or [None,''])[1];keep=[b for b in blocks if not sup or nm(b) in sup];drop=sorted(nm(b) for b in blocks if sup and nm(b) not in sup);v=re.search(r'<version>.*?</version>', src);open('/tmp/haviq_manifest.xml','w').write('<?xml version=\"1.0\" encoding=\"UTF-8\"?>' + chr(10) + '<Package xmlns=\"http://soap.sforce.com/2006/04/metadata\">' + chr(10) + chr(10).join(keep) + chr(10) + (v.group(0) if v else '<version>62.0</version>') + chr(10) + '</Package>');print('[haviq] types asked for: '+str(len(blocks))+', supported by this org: '+str(len(keep))+', not available here: '+str(len(drop)));print('[haviq] not in this org: '+','.join(drop[:25])+(' and more' if len(drop)>25 else '')) if drop else None;print('[haviq] NOTE: could not read the org type list; asking for everything') if not sup else None" || cp -f manifest/haviq-retrieve.xml /tmp/haviq_manifest.xml
          if ! grep -q "<name>" /tmp/haviq_manifest.xml 2>/dev/null; then
            echo "[haviq] None of the requested types exist in this org. Nothing to"
            echo "[haviq] retrieve. Narrow My Scope to types this org actually has."
            exit 1
          fi
          sf project retrieve start --manifest /tmp/haviq_manifest.xml --target-org haviq-source --wait 30 --json > /tmp/haviq_retrieve.json || true
          python3 -c "import json;d=json.load(open('/tmp/haviq_retrieve.json'));r=d.get('result') or {};rows=r.get('files') or r.get('fileProperties');print('[haviq] retrieve did not return files. Full result below.') if not rows else None;print('[haviq] '+json.dumps({k:v for k,v in r.items() if k not in ('files','fileProperties')})[:1500]) if not rows else None" 2>/dev/null || echo "[haviq] retrieve produced no readable JSON at all"
          python3 -c "import json;raw=open('/tmp/haviq_retrieve.json').read();raw=raw[raw.index(chr(123)):] if chr(123) in raw else '{}';d=json.loads(raw); r=d.get('result') or {};rows=r.get('files') or r.get('fileProperties') or [];S=set(['c','e','mdt','b','x','kav','Share','History','Feed','ChangeEvent','r']);nsp=lambda n:(lambda p: len(p)>1 and not (len(p)==2 and p[1] in S))(n.replace('-','.').split('.')[-1].split('__'));man=lambda f: bool(f.get('namespacePrefix')) or (f.get('manageableState') not in (None,'unmanaged')) or nsp(f.get('fullName',''));ok=[f for f in rows if f.get('type') and f.get('fullName') and str(f.get('state','')).lower()!='failed' and not man(f)];mg=[f for f in rows if man(f)];open('/tmp/haviq_members.txt','w').write(','.join(sorted(set(f['type']+':'+f['fullName'] for f in ok))));open('/tmp/haviq_drop.txt','w').write(chr(10).join(f.get('filePath') or f.get('fullName') for f in mg));print('[haviq] managed components excluded: '+str(len(mg))+' of '+str(len(rows)))" 2>/dev/null || printf "" > /tmp/haviq_members.txt
          MEMBERS=$(cat /tmp/haviq_members.txt 2>/dev/null || echo "")
          echo "[haviq] retrieved: $MEMBERS"
          if [ -s /tmp/haviq_drop.txt ]; then
            while IFS= read -r P; do
              [ -z "$P" ] && continue
              if [ -e "$P" ]; then rm -f "$P";
              else find force-app -type f -name "${P}.*" -delete 2>/dev/null || true; fi
            done < /tmp/haviq_drop.txt
          fi
          printf "%s" "$MEMBERS" > /tmp/haviq_members.txt
          if [ -z "$MEMBERS" ]; then
            echo "[haviq] The retrieve returned no components. Nothing will be"
            echo "[haviq] committed — a commit here would delete the request file"
            echo "[haviq] and report success having retrieved nothing."
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/haviq_retrieve.json'));ms=(d.get('result') or {}).get('messages') or [];ms=[ms] if isinstance(ms,dict) else ms;[print('[haviq] WARNING from retrieve: '+str(m.get('problem'))) for m in ms]" 2>/dev/null || true
          git config user.email "ci@haviq.local"
          git config user.name "HAV-IQ CI"
          cp -f manifest/haviq-retrieve-keep.txt /tmp/haviq_keep.txt 2>/dev/null || true
          rm -f manifest/haviq-retrieve.xml manifest/haviq-retrieve-keep.txt
          git rm -q --cached --ignore-unmatch manifest/haviq-retrieve.xml manifest/haviq-retrieve-keep.txt >/dev/null 2>&1 || true
          if [ -s /tmp/haviq_keep.txt ]; then
            while IFS= read -r KD; do
              [ -n "$KD" ] && git add -- "$KD" 2>/dev/null || true
            done < /tmp/haviq_keep.txt
          else
            echo "[haviq] no keep-list in the request — refusing to guess"
            echo "[haviq] which retrieved files are safe to commit."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "[haviq] nothing to commit — the retrieve produced no files."
          else
            git commit -m "chore: HAV-IQ CI retrieve [skip ci]"
            n=0
            until git push origin HEAD:dev 2>/tmp/haviq_push.err; do
              n=$((n+1))
              sed "s/^/[haviq]   /" /tmp/haviq_push.err || true
              if grep -qiE "restrict|protected|permission|denied|403" /tmp/haviq_push.err; then
                echo "[haviq] GitHub refused the push to dev. Branch protection on it"
                echo "[haviq] blocks the workflow's GITHUB_TOKEN. Allow GitHub Actions to push to"
                echo "[haviq] dev (or exempt it from the rule), then retry the deployment."
                exit 1
              fi
              [ $n -ge 3 ] && echo "[haviq] push failed after $n attempts" && exit 1
              echo "[haviq] push rejected — the branch moved. Rebasing (attempt $n)."
              git pull --rebase origin dev || { \
                echo "[haviq] REBASE CONFLICT. Someone edited the same component"; \
                echo "[haviq] while this retrieve was running. Resolve it in HAV-IQ"; \
                echo "[haviq] and retry — this job will not resolve it for you."; \
                exit 1; }
            done
          fi
      - name: Notify HAV-IQ
        if: always()
        env:
          HQ_STATUS: ${{ job.status == 'success' && 'success' || 'failed' }}
          HQ_BRANCH: ${{ github.ref_name }}
          HQ_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HAVIQ_PRIVATE_KEY: ${{ secrets.HAVIQ_PRIVATE_KEY }}
          HAVIQ_CLIENT_ID: ${{ vars.HAVIQ_CLIENT_ID }}
          HAVIQ_USERNAME: ${{ vars.HAVIQ_USERNAME }}
          HAVIQ_URL: ${{ vars.HAVIQ_URL }}
          SF_WEBHOOK_SECRET: ${{ secrets.SF_WEBHOOK_SECRET }}
        run: |
          grep -q "\[haviq-retrieve\]" /tmp/haviq_msg.txt 2>/dev/null || exit 0
          echo "$HAVIQ_PRIVATE_KEY" > /tmp/haviq.key
          HAVIQ_LOGIN_OUT=$(sf org login jwt --client-id "$HAVIQ_CLIENT_ID" --jwt-key-file /tmp/haviq.key --username "$HAVIQ_USERNAME" --instance-url "$HAVIQ_URL" --alias haviq-hub 2>&1) || true
          SF_TOKEN=$(sf org auth show-access-token --target-org haviq-hub --json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result']['accessToken'])" 2>/dev/null || echo "")
          case "$SF_TOKEN" in *[[:space:]]*) SF_TOKEN="" ;; esac
          if [ -z "$SF_TOKEN" ]; then
            echo "[haviq] callback SKIPPED — no access token. HAV-IQ will read this"
            echo "[haviq] run's result itself within a few minutes. The JWT login said:"
            echo "$HAVIQ_LOGIN_OUT" | head -6 | sed "s/^/[haviq]   /"
          else
            DEPID=$(sed -n "s/.*for deployment \([a-zA-Z0-9]*\).*/\1/p" /tmp/haviq_msg.txt | head -1)
            MEMBERS=$(cat /tmp/haviq_members.txt 2>/dev/null || echo "")
            BODY="{\"phase\":\"retrieve\",\"deploymentId\":\"$DEPID\",\"branch\":\"$HQ_BRANCH\",\"status\":\"$HQ_STATUS\",\"retrievedMembers\":\"$MEMBERS\",\"ciRunUrl\":\"$HQ_RUN_URL\"}"
            HAVIQ_HTTP=$(curl -s -o /tmp/haviq_cb.out -w "%{http_code}" -X POST "$HAVIQ_URL/services/apexrest/haviq/pipeline/webhook" -H "Authorization: Bearer $SF_TOKEN" -H "Content-Type: application/json" -H "x-sf-devops-secret: $SF_WEBHOOK_SECRET" -d "$BODY" || echo "000")
            echo "[haviq] retrieve callback HTTP $HAVIQ_HTTP"
            [ "$HAVIQ_HTTP" = "200" ] || head -c 500 /tmp/haviq_cb.out 2>/dev/null | sed "s/^/[haviq]   /" || true
            rm -f /tmp/haviq_cb.out
          fi
          rm -f /tmp/haviq.key server.key /tmp/haviq_members.txt

  # ── Rollback: dev1
  rollback_dev1:
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'rollback/dev1-')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @salesforce/cli
      - run: |
          echo "${{ secrets.SF_JWT_KEY_DEV1 }}" > server.key
          sf org login jwt --client-id ${{ vars.SF_CLIENT_ID_DEV1 }} --jwt-key-file server.key --username ${{ vars.SF_USERNAME_DEV1 }} --instance-url ${{ vars.SF_ORG_URL_DEV1 }} --alias target
      - name: Resolve HAV-IQ manifest
        env:
          HAVIQ_VARS: ${{ toJSON(vars) }}
        run: |
          TOK=$(git log -20 --pretty=%B | grep -oE "\[haviq-dep:[A-Za-z0-9]+\]" | head -1 | sed -E "s/.*:([A-Za-z0-9]+)\]/\1/")
          if [ -z "$TOK" ]; then
            if [ -s manifest/package.xml ]; then
              echo "No [haviq-dep:] token; falling back to the manifest on the branch."
              exit 0
            fi
            echo "ERROR: no manifest on the branch and no [haviq-dep:] token in the commit message"; exit 1
          fi
          echo "SF_DEPLOYMENT_ID=$TOK" >> "$GITHUB_ENV"
          # GitHub stores Actions variable names UPPERCASED, and deploy ids are
          # mixed case — look up the uppercased name or the lookup silently misses.
          TOK=$(echo "$TOK" | tr "[:lower:]" "[:upper:]")
          mkdir -p manifest
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_PKG_$TOK" '.[$k] // empty' > manifest/package.xml
          if [ ! -s manifest/package.xml ]; then echo "ERROR: variable HAVIQ_PKG_$TOK not set"; exit 1; fi
          echo "$HAVIQ_VARS" | jq -r --arg k "HAVIQ_DESTRUCTIVE_$TOK" '.[$k] // empty' > manifest/destructiveChanges.xml
          echo "[OI-292] manifest (dep $TOK):"; cat manifest/package.xml
      - run: |
          # OI-278 (v1.50): single sf project deploy start per rollback job
          HAS_DEL=$( [ -f manifest/destructiveChanges.xml ] && grep -q "<members>" manifest/destructiveChanges.xml && echo 1 || echo 0 )
          HAS_PKG=$( [ -f manifest/package.xml ] && grep -q "<members>" manifest/package.xml && echo 1 || echo 0 )
          if [ "$HAS_DEL" = "1" ]; then
            echo "Rollback: reverting (destructive + restore in one operation)..."
            set +e
            DOUT=$(sf project deploy start --manifest manifest/package.xml --pre-destructive-changes manifest/destructiveChanges.xml --target-org target --test-level NoTestRun --wait 30 2>&1)
